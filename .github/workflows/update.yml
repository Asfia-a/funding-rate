name: Update funding rates

on:
  schedule:
    # 每 10 分钟更新一次（GitHub Actions 免费额度足够，一天 144 次）
    - cron: "*/10 * * * *"
  workflow_dispatch:      # 也可以手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build site
        run: python build_site.py
        # Actions 的服务器在海外，直连交易所 API，不需要代理

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ || true
          git diff --staged --quiet || git commit -m "auto: update funding data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
